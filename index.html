<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <title>小鱼儿 · 足球分析</title>
  <link rel="stylesheet" href="assets/dashboard.css">
  <script src="assets/dashboard.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#matches">跳到比赛列表</a>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="小鱼儿足球分析首页"><span class="brand-mark" aria-hidden="true">鱼</span><strong>小鱼儿<span>足球分析</span></strong></a>
      <div class="header-tools"><span class="edition">比赛 · 比分 · 判断依据</span><button id="refresh" type="button">刷新数据 <span aria-hidden="true">↻</span></button></div>
    </div>
  </header>
  <main class="layout">
    <section class="overview" aria-labelledby="page-title">
      <div class="section-heading"><div><p class="eyebrow">FOOTBALL / MATCH INTELLIGENCE</p><h1 id="page-title">先看比分，再看依据。</h1></div><div id="metrics" class="metrics" aria-label="比赛概览"></div></div>
      <div id="snapshot-status" class="snapshot-banner" role="status" aria-live="polite">正在读取比赛数据…</div>
    </section>
    <section class="controls" aria-label="比赛筛选">
      <div class="quick-filters" role="group" aria-label="快捷筛选">
        <button type="button" data-view="all" aria-pressed="true">全部比赛 <span data-count="all">—</span></button>
        <button type="button" data-view="d" aria-pressed="false">D 级分析 <span data-count="d">—</span></button>
        <button type="button" data-view="risk" aria-pressed="false">风险比分 <span data-count="risk">—</span></button>
        <button type="button" data-view="today" aria-pressed="false">今日 <span data-count="today">—</span></button>
      </div>
      <div class="search-tools">
        <label class="search-label"><span class="sr-only">查找球队、联赛或场次编号</span><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索球队 / 联赛" autocomplete="off"></label>
        <details class="filter-menu"><summary>筛选 <span aria-hidden="true">☷</span></summary><div class="toolbar">
          <label>联赛<select id="league"><option value="">全部联赛</option></select></label>
          <label>评级<select id="tier"><option value="">全部等级</option><option>S</option><option>A</option><option>B</option><option>C</option><option>D</option><option value="unknown">未评级</option></select></label>
          <label>状态<select id="status"><option value="">全部状态</option><option value="today">今日赛程</option><option value="fresh">未开赛 · 数据有效</option><option value="stale">历史 / 已过期</option><option value="unknown">时间待核验</option><option value="abstain">弃权 / 无主预测</option><option value="risk">有风险比分</option><option value="eligible">当前可关注</option></select></label>
          <label>排序<select id="sort"><option value="source">原始顺序</option><option value="kickoff">开赛时间</option><option value="tier">评级优先</option><option value="risk">风险比分优先</option></select></label>
          <button id="reset" type="button">重置全部筛选</button>
        </div></details>
      </div>
    </section>
    <section id="watchlist" class="watchlist" aria-label="当前可关注比赛" hidden></section>
    <div class="list-heading"><h2>比赛一览 <span id="result-count"></span></h2><label class="toggle"><input type="checkbox" id="expand-all"> 展开全部依据</label></div>
    <div id="matches" tabindex="-1" aria-live="polite"><div class="empty">正在加载比赛…</div></div>
    <footer><p>D 是原预测评级；风险比分与副文提及单独展示。副文出现某个比分，不等于推荐该比分。</p><p>历史记录保留原判断，不作为当前推荐。概率缺失不补值；模型信心不代表历史命中率。<span id="version">联赛分析 v21</span></p></footer>
  </main>
</body>
</html>
