name: Check AI Model Availability

# Manual read-only catalog lookup; never sends prediction prompts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: List available Grok model identifiers
        env:
          API_URL: ${{ secrets.GROK_API_URL }}
          API_KEY: ${{ secrets.GROK_API_KEY }}
          PYTHONUTF8: "1"
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ.get('API_URL', '').strip().rstrip('/')
          key = os.environ.get('API_KEY', '').strip()
          parsed = urllib.parse.urlsplit(base)
          if parsed.scheme != 'https' or not parsed.hostname or not key:
              raise SystemExit('Missing key or valid HTTPS model API URL')
          path = parsed.path.removesuffix('/chat/completions').rstrip('/') + '/models'
          url = urllib.parse.urlunsplit((parsed.scheme, parsed.netloc, path, '', ''))

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + key})
          try:
              with opener.open(request, timeout=20) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit('Model catalog HTTP status: ' + str(exc.code)) from None
          except Exception as exc:
              raise SystemExit('Model catalog error: ' + type(exc).__name__) from None
          data = payload.get('data', []) if isinstance(payload, dict) else []
          ids = sorted({item['id'] for item in data if isinstance(item, dict)
                        and isinstance(item.get('id'), str) and 'grok' in item['id'].lower()})
          print(json.dumps({'grok_models': ids, 'count': len(ids)}, ensure_ascii=False))
