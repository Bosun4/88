name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - .nojekyll
      - data/**
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare public site only
        run: |
          mkdir -p _site/data
          cp index.html .nojekyll _site/
          cp -R assets _site/
          cp data/*.json _site/data/
          if [ -d data/snapshots ]; then
            cp -R data/snapshots _site/data/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
