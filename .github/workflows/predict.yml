name: Football AI Predict

# Paid prediction calls are manual-only. Never add push/schedule here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-ai-predict-single-run
  cancel-in-progress: false

jobs:
  predict:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 pytest-socket==0.8.1 PyYAML==6.0.3
          python -m pip check

      - name: Run offline regression gate
        env:
          VMAX_ALLOW_AUTO_INSTALL: "false"
          PYTHONUTF8: "1"
        run: python -m pytest -q --disable-socket --allow-unix-socket

      # Cache keys are unique per run; restore the most recent cache for this
      # code revision. Evidence hashes + the 1800s TTL decide actual cache hits.
      - name: Restore prediction evidence cache
        uses: actions/cache/restore@v4
        with:
          path: data/ai_cache
          key: prediction-evidence-v21-${{ hashFiles('scripts/*.py', 'requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            prediction-evidence-v21-${{ hashFiles('scripts/*.py', 'requirements.txt') }}-

      - name: Prepare runtime directories
        run: mkdir -p data/ai_cache data/ai_phase_results

      - name: Run Predictions
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
          VMAX_ALLOW_AUTO_INSTALL: "false"
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WENCAI_AUTHORIZATION: ${{ secrets.WENCAI_AUTHORIZATION }}
          GPT_API_KEY: ${{ secrets.GPT_API_KEY }}
          GPT_API_URL: ${{ secrets.GPT_API_URL }}
          # Empty repository variable keeps the model default in scripts/config.py.
          GPT_MODEL: ${{ vars.GPT_MODEL }}
          AI_RUN_MODE: "single_pass"
          AI_PRIMARY_MODEL: "gpt"
          AI_BATCH_SIZE: "6"
          AI_CHUNK_CONCURRENCY: "2"
          AI_MODEL_CONCURRENCY: "2"
          AI_SINGLE_PASS_MAX_CALLS: "12"
          AI_CONNECT_TIMEOUT: "20"
          AI_READ_TIMEOUT: "180"
          AI_HTTP_TOTAL_TIMEOUT: "180"
          AI_PHASE1_RETRY_MAX: "0"
          AI_FINAL_RETRY_MAX: "0"
          AI_ENDPOINT_FAILOVER: "false"
          AI_ENABLE_CROSS_EXAM: "false"
          AI_ENABLE_CONSISTENCY_JUDGE: "false"
          AI_ENABLE_FALLBACK_REFEREE: "false"
          AI_ENABLE_FAMILY_DEBATE_REFEREE: "false"
          AI_ALLOW_SECOND_CALL_REPAIR: "false"
          AI_ENABLE_CLAUDE_JSON_REPAIR: "false"
          AI_ENABLE_ANY_MODEL_JSON_REPAIR: "false"
          AI_MAX_OUTPUT_TOKENS: "16000"
          AI_ENABLE_CACHE: "true"
          AI_DISABLE_CACHE: "false"
          AI_PERSISTENT_CACHE_ENABLED: "true"
          AI_DECISION_CACHE_TTL: "1800"
          AI_CACHE_DIR: "data/ai_cache"
          AI_SAVE_RAW_RESPONSE: "false"
          AI_PARSE_DEBUG: "false"
          VMAX_RUN_DAYS: "today"
          AI_RUN_DAYS: "today"
          VMAX_DATE_SHIFT_HOURS: "11"
        run: python scripts/main.py

      - name: Save prediction evidence cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/ai_cache
          key: prediction-evidence-v21-${{ hashFiles('scripts/*.py', 'requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload prediction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            data/ai_phase_results/
            data/predictions.json
            data/forward_ledger.jsonl

      - name: Push data updates
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "origin/main advanced during prediction; refusing to publish stale-base outputs. Run the manual workflow again."
            exit 1
          fi

          # Use the exact paths recorded by this run, not a newest-mtime guess.
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path.cwd().resolve()
          live = root / "data/predictions.json"
          payload = json.loads(live.read_text(encoding="utf-8"))
          runtime = payload["runtime"]
          paths = [live, root / runtime["history_path"], root / runtime["snapshot_path"]]
          for path in paths:
              path = path.resolve()
              if not path.is_relative_to(root / "data") or path.suffix != ".json":
                  raise SystemExit(f"Unexpected publish path: {path}")
              text = path.read_text(encoding="utf-8")
              if any(line.startswith(("<<<<<<<", "=======", ">>>>>>>")) for line in text.splitlines()):
                  raise SystemExit(f"Conflict marker in {path}")
              # Reject NaN/Infinity and validate with the browser's JSON parser too.
              json.loads(text, parse_constant=lambda value: (_ for _ in ()).throw(ValueError(value)))
              subprocess.run(["node", "-e", "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))", str(path)], check=True)
              subprocess.run(["git", "add", "--", str(path.relative_to(root))], check=True)
              print(f"JSON OK: {path.relative_to(root)}")
          from forward_ledger.ledger import read_verified_entries
          ledger = root / "data/forward_ledger.jsonl"
          entries = list(read_verified_entries(ledger))
          if not entries:
              raise SystemExit("Missing forward locks: refusing publication")
          subprocess.run(["git", "add", "--", "data/forward_ledger.jsonl"], check=True)
          print(f"Forward ledger verified: {len(entries)} records")
          PY

          if ! git diff --cached --quiet; then
            git commit -m "chore: update manual single-pass prediction data"
            git push origin HEAD:main
          else
            echo "Prediction data unchanged."
          fi

  # GITHUB_TOKEN pushes do not trigger another push workflow. Explicitly deploy
  # after the manual prediction job succeeds, without invoking any AI again.
  deploy_pages:
    needs: predict
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
